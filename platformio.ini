[platformio]
default_envs = esp32c3

[common]
f_cpu = 160000000L
framework = arduino
upload_speed = 460800
monitor_speed = 115200
lib_deps =
  ArduinoJson@6.19.1
  me-no-dev/AsyncTCP@1.1.1
  ESPAsyncUDP
  https://github.com/lorol/ESPAsyncWebServer
  AsyncMqttClient@0.9.0
  https://github.com/miguelbalboa/rfid#ea7ee3f3daafd46d0c5b8438ba41147c384a1f0d
  matjack1/Wiegand Protocol Library for Arduino - for esp-rfid@^1.1.1
  Time@1.5
  Bounce2@2.52

[common_esp8266]
platform = espressif8266@2.3.2
board = esp12e
build_flags = 	-Wl,-Teagle.flash.4m2m.ld

[common_esp32]
platform = espressif32@6.6.0
board = esp32dev
build_flags =
lib_deps =
  ArduinoJson@6.19.1
  ESP32Async/AsyncTCP@^3.3.2
  ESP32Async/ESPAsyncWebServer@^3.7.0
  AsyncMqttClient@0.9.0
  https://github.com/miguelbalboa/rfid#ea7ee3f3daafd46d0c5b8438ba41147c384a1f0d
  matjack1/Wiegand Protocol Library for Arduino - for esp-rfid@^1.1.1
  Time@1.5
  Bounce2@2.52

[common_esp32c3]
platform = espressif32@6.6.0
board = esp32-c3-devkitm-1
build_flags =
  -DDEBUG
  -fpermissive
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  ArduinoJson@6.19.1
  ESP32Async/AsyncTCP@3.3.2
  ESP32Async/ESPAsyncWebServer@~3.7.0
  https://github.com/OttoWinter/async-mqtt-client
  https://github.com/miguelbalboa/rfid#ea7ee3f3daafd46d0c5b8438ba41147c384a1f0d
  matjack1/Wiegand Protocol Library for Arduino - for esp-rfid@^1.1.1
  Time@1.5
  Bounce2@2.52

; boards which GPIO0 and RESET controlled using two NPN transistors as nodemcu devkit (includes wemos d1 mini)
[env:generic]
board_build.f_cpu = ${common.f_cpu}
platform = ${common_esp8266.platform}
framework = ${common.framework}
board = ${common_esp8266.board}
;upload_resetmethod = nodemcu
lib_deps = ${common.lib_deps}
extra_scripts = scripts/GENdeploy.py
build_flags = ${common_esp8266.build_flags}
;https://github.com/platformio/platform-espressif8266/issues/153
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_build.flash_mode = dio

; generic firmware for debugging purposes
[env:debug]
board_build.f_cpu = ${common.f_cpu}
platform = ${common_esp8266.platform}
framework = ${common.framework}
board = ${common_esp8266.board}
lib_deps = ${common.lib_deps}
build_flags = ${common_esp8266.build_flags}
		-DDEBUG
extra_scripts = scripts/DBGdeploy.py
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}

[env:esp32]
board_build.f_cpu = ${common.f_cpu}
platform = ${common_esp32.platform}
framework = ${common.framework}
board = ${common_esp32.board}
lib_deps = ${common_esp32.lib_deps}
lib_ignore = ESPAsyncTCP
extra_scripts = scripts/ESP32deploy.py
build_flags = ${common_esp32.build_flags}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}

[env:esp32c3]
board_build.f_cpu = ${common.f_cpu}
platform = ${common_esp32c3.platform}
framework = ${common.framework}
board = ${common_esp32c3.board}
lib_deps = ${common_esp32c3.lib_deps}
lib_ignore = ESPAsyncTCP, AsyncTCP-esphome
extra_scripts = scripts/ESP32deploy.py
build_flags = ${common_esp32c3.build_flags}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
