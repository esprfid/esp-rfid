name: Platformio build

on: push

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.10
      uses: actions/setup-python@v2
      with:
        python-version: "3.10"
    - name: Install Platformio
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run Platformio builds
      run: |
        platformio run -e generic -e debug
    - name: Test bounded MQTT chunk assembly
      run: |
        c++ -std=c++11 -Wall -Wextra -Werror -I src test/native/test_mqtt_buffer.cpp -o /tmp/test_mqtt_buffer
        /tmp/test_mqtt_buffer
    - name: Export bins
      uses: actions/upload-artifact@v4
      with:
        name: bins
        path: |
          bin/generic.bin
          bin/forV2Board.bin
          bin/debug.bin
